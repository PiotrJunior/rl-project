# ALE code path. NOT RUN as part of this project's results -- a Rainbow-class
# Atari run is ~10M frames (a GPU-day each, and this study needs 5 seeds x 8
# variants). Included so the identical agent and exploration policies can be
# pointed at Atari on suitable hardware; the wrappers are unit-tested in
# tests/test_atari_wrappers.py. See the "Atari" section of the README.
env:
  id: ALE/Breakout-v5
  kind: atari
  frame_skip: 4
  frame_stack: 4
  screen_size: 84
  grayscale: true
  terminal_on_life_loss: false
  repeat_action_probability: 0.25   # sticky actions (Machado et al. 2018)
  clip_rewards: true
  noop_max: 30
agent:
  lr: 0.0000625
  batch_size: 32
  learning_starts: 20000
  target_update_interval: 8000
  net:
    cnn_channels: [32, 64, 64]
    cnn_kernels: [8, 4, 3]
    cnn_strides: [4, 2, 1]
    cnn_hidden: 512
  replay:
    capacity: 1000000
train:
  total_steps: 10000000
  eval_interval: 250000
  eval_episodes: 5
run:
  device: cuda
