# HEADLINE study on LunarLander-v3 -- the environment the project brief names.
# 4 actions is the smallest count at which top-k exploration has two distinct
# non-trivial settings (k = 2 and k = 3).
#
# Budget note (corrected): an earlier version of this file ran a truncated
# 120k-step budget out of a mistaken belief that LunarLander was ~8x slower per
# step than classic control on this hardware. That measurement was an artifact
# of stale orphaned worker processes competing for CPU at the time, not a real
# Box2D cost -- measured cleanly, LunarLander runs at essentially the same
# throughput as Acrobot/CartPole (~650-700 steps/s per worker on 4 cores), so
# the full 400k-step budget from configs/env/lunarlander.yaml is affordable
# here (~1 h for all 24 runs on 4 workers) and is used directly.
base: base
out_dir: results/runs/main_gym
envs: [env/lunarlander]
policies:
  - policy/eps_greedy
  - policy/boltzmann
  - policy/eps_boltzmann
  - policy/mixture_anneal
  - policy/topk_boltzmann
  - policy/topk3_boltzmann
  - policy/anneal_k
  - policy/topp_boltzmann
seeds: [0, 1, 2]
overrides:
  train:
    eval_episodes: 10
