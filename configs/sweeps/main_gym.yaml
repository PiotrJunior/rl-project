# MAIN study on LunarLander -- the environment the project brief names.
# 4 actions is the smallest count at which top-k exploration has a real choice
# (k = 2 and k = 3 are both strictly between greedy and full Boltzmann).
#
# Cost: 8 arms x 3 seeds x 250k steps. ~10 min per run at ~400 steps/s, so
# ~4 CPU-hours total, or ~1 hour wall-clock on 4 workers.
base: base
out_dir: results/runs/main_gym
envs: [env/lunarlander]
policies:
  - policy/eps_greedy
  - policy/boltzmann
  - policy/eps_boltzmann
  - policy/mixture_anneal
  - policy/topk_boltzmann
  - policy/topk3_boltzmann
  - policy/anneal_k
  - policy/topp_boltzmann
seeds: [0, 1, 2]
overrides:
  train:
    total_steps: 250000
    eval_interval: 12500
    eval_episodes: 10
    diagnostics_interval: 2500
  agent:
    replay: {capacity: 150000}
